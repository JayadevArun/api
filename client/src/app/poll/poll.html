<div class="bg-blur"></div>
<div class="bg-overlay"></div>

<div class="container py-5">
  <div class="row justify-content-center mb-5">
    <div class="col-lg-8">
      <div class="glass-card p-4 shadow-lg rounded-4">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark">📝 Create a New Poll</h2>
          <p class="text-muted">Design your poll and share it with the world.</p>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Poll Question</label>
          <input
            [(ngModel)]="newPoll.question"
            placeholder="What do you want to ask?"
            class="form-control form-control-lg"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Options</label>
          <div
            *ngFor="let option of newPoll.options; let i = index; trackBy: trackByIndex"
            class="input-group mb-2"
          >
            <input
              [(ngModel)]="option.optionText"
              placeholder="Option text"
              class="form-control"
              required
            />
            <button
              *ngIf="newPoll.options.length > 2"
              (click)="newPoll.options.splice(i, 1)"
              class="btn btn-outline-danger"
              type="button"
              title="Remove Option"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <button (click)="addOption()" class="btn btn-outline-dark w-100 mt-2">
            <i class="bi bi-plus-circle me-2"></i> Add Another Option
          </button>
        </div>

        <div class="text-center">
          <button (click)="createPoll()" class="btn btn-success btn-lg px-5">
            ✅ Submit Poll
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="glass-card p-4 shadow rounded-4">
        <h3 class="text-center text-dark">📋 Available Polls</h3>

        <div *ngIf="polls.length === 0" class="text-center text-muted">
          No polls yet. Be the first to create one!
        </div>

        <div *ngFor="let poll of polls" class="card mb-4 border-0 shadow-sm">
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ poll.question }}</h5>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button
                *ngFor="let option of poll.options; let i = index"
                (click)="vote(poll.id, i)"
                class="btn btn-outline-primary"
              >
                {{ option.optionText }}
                <span class="badge bg-secondary ms-1">{{ option.voteCount }} votes</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
